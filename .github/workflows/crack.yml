# zippass cloud boost - one workflow_dispatch fans out to a matrix of
# shard jobs (default 20 = the Free plan's concurrent-job cap on
# standard runners, 4 vCPU each -> 80 cores). each shard scans its slice
# of the candidate space with the rust verifier built here and uploads a
# found-shard-N artifact ONLY when its slice produced verifier passes
# (pv passes are ~1/65536, so usually nothing uploads). the local app
# collects the artifacts, sorts passes by global index and confirms them
# against the real archive. stdlib-only python on the runner; the spec
# arrives through env vars (never interpolated into the script text).
name: zippass-crack

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "attack spec json built by the local zippass app"
        required: true
        type: string
      shards:
        description: "number of shard jobs (1-20)"
        required: false
        default: "20"
        type: string

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - id: mk
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          n=$(python3 -c "import sys; print(max(1, min(20, int(sys.argv[1]))))" "$SHARDS")
          arr=$(python3 -c "import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$n")
          echo "matrix=$arr" >> "$GITHUB_OUTPUT"

  crack:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 350          # hosted runner hard cap is 6h
    strategy:
      fail-fast: false            # one infra-blip shard must not kill the rest
      matrix:
        shard: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: build rust verifier
        run: |
          cargo build --release --manifest-path rust/aesfast_rs/Cargo.toml
          mkdir -p zippass/_native
          cp target/release/libaesfast_rs.so zippass/_native/

      - name: scan shard
        env:
          ZIPPASS_GH_SPEC: ${{ inputs.spec }}
          SHARDS: ${{ inputs.shards }}
          ZIPPASS_AESFAST_LIB: ${{ github.workspace }}/zippass/_native/libaesfast_rs.so
        run: |
          python3 -m zippass.ghshard --spec "$ZIPPASS_GH_SPEC" \
            --shard ${{ matrix.shard }} --shards "$SHARDS" --out found.txt

      - name: upload verifier passes
        if: hashFiles('found.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: found-${{ matrix.shard }}
          path: found.txt
          retention-days: 7
